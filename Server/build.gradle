plugins {
  id 'io.miret.etienne.sass' version '1.6.1'
  id 'com.github.node-gradle.node' version '7.1.0'
}

apply plugin: 'war'
apply plugin: 'io.miret.etienne.sass'

description = 'Serveur Registre'
archivesBaseName = 'Registre'

dependencies {
  implementation project(':Model')
  implementation project(':Security')
  implementation group: 'org.springframework', name: 'spring-context'
  implementation group: 'org.springframework', name: 'spring-webmvc'
  implementation group: 'org.springframework', name: 'spring-context-support'
  implementation group: 'org.springframework', name: 'spring-orm'
  implementation group: 'org.springframework.security', name: 'spring-security-config'
  implementation group: 'org.springframework.security', name: 'spring-security-web'
  implementation group: 'org.hibernate.validator', name: 'hibernate-validator'
  providedCompile group: 'org.slf4j', name: 'slf4j-api'
  providedCompile group: 'javax.servlet', name: 'javax.servlet-api'
  runtimeOnly group: 'org.thymeleaf', name: 'thymeleaf-spring5'
  runtimeOnly group: 'org.thymeleaf.extras', name: 'thymeleaf-extras-springsecurity5'
  testImplementation group: 'junit', name: 'junit'
  testImplementation group: 'org.mockito', name: 'mockito-core'
  testImplementation group: 'org.assertj', name: 'assertj-core'
  testRuntimeOnly group: 'org.slf4j', name: 'slf4j-log4j12'
}

node {
  version = '26.13.1'
  yarnVersion = '1.22.22'
  download = true
}

sass {
  version = '1.108.2'
}

compileSass {
  sourceDir = project.file ("${projectDir}/src/main/scss")
  destPath = "resources"
}

task tsc (type: YarnTask) {
  args = ['run', 'tsc', '--outdir', "$buildDir/js/resources"]

  inputs.file file ('tsconfig.json')
  inputs.dir file ('src/main/ts')
  outputs.dir file ("$buildDir/js")
  dependsOn yarn
}

war {
  from file ("$buildDir/js")
  webInf {
    from 'src/main/xhtml'
    into 'thymeleaf'
  }
  dependsOn tsc
}

clean {
  delete 'node_modules'
}
