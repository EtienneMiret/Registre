plugins {
  id 'io.miret.etienne.sass' version '1.6.1'
  id 'com.github.node-gradle.node' version '7.1.0'
}

apply plugin: 'war'
apply plugin: 'io.miret.etienne.sass'

description = 'Serveur Registre'

base {
  archivesName = 'Registre'
}

dependencies {
  implementation project(':Model')
  implementation project(':Security')
  implementation "org.springframework:spring-context"
  implementation "org.springframework:spring-webmvc"
  implementation "org.springframework:spring-context-support"
  implementation "org.springframework:spring-orm"
  implementation "org.springframework.security:spring-security-config"
  implementation "org.springframework.security:spring-security-web"
  implementation libs.hibernate.validator
  providedCompile libs.slf4j.api
  providedCompile libs.jakarta.servlet
  runtimeOnly libs.bundles.thymeleaf
  testImplementation libs.bundles.tests
  testRuntimeOnly libs.slf4j.log4j12
}

node {
  version = '26.13.1'
  yarnVersion = '1.22.22'
  download = true
}

sass {
  version = '1.108.2'
}

compileSass {
  sourceDir = project.layout.projectDirectory.dir("src/main/scss").asFile
  destPath = "resources"
}

tasks.register("tsc", YarnTask) {
  def jsDirectory = project.layout.buildDirectory.dir("js")
  args = jsDirectory.map {
    ["run", "tsc", "--outdir", "$it/resources"]
  }

  inputs.file file ('tsconfig.json')
  inputs.dir file ('src/main/ts')
  outputs.dir project.layout.buildDirectory.dir("js")
  dependsOn yarn
}

tasks.compileJava {
  options.compilerArgs << "-parameters"
}

war {
  from project.layout.buildDirectory.dir("js")
  webInf {
    from 'src/main/xhtml'
    into 'thymeleaf'
  }
  dependsOn tsc
}

clean {
  delete 'node_modules'
}
