plugins {
  id 'java-library'
}

description = 'Modèle Registre'

dependencies {
  api(platform(libs.spring.framework))
  api(platform(libs.spring.security))
  api libs.eclipse.persistence
  implementation libs.slf4j.api
  testImplementation libs.bundles.tests
  testImplementation libs.equalsverifier
  testImplementation "org.springframework:spring-test"
  testImplementation "org.springframework:spring-context"
  testImplementation "org.springframework:spring-orm"
  testRuntimeOnly libs.h2
  testRuntimeOnly libs.slf4j.log4j12
  testRuntimeOnly libs.slf4j.jul
}

processTestResources {
    expand(basedir: "$rootDir/Model")
}
