plugins {
  id 'java-library'
}

description = 'Registre Sécurité'

dependencies {
  api project(':Model')
  implementation libs.slf4j.api
  implementation libs.mitre.openid.connect
  testImplementation libs.bundles.tests
  testRuntimeOnly libs.slf4j.log4j12
  testRuntimeOnly "org.springframework:spring-orm"
  testRuntimeOnly libs.h2
}

processTestResources {
  expand rootdir: rootDir
}
