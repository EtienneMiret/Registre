plugins {
  id 'com.gradleup.shadow' version '8.3.11'
}

description = ''
dependencies {
  implementation project(':Model')
  implementation group: 'org.slf4j', name: 'slf4j-api'
  implementation group: 'org.springframework', name: 'spring-context'
  implementation group: 'javax.transaction', name: 'javax.transaction-api'
  runtimeOnly group: 'org.springframework', name: 'spring-orm'
  testImplementation group: 'junit', name: 'junit'
  testImplementation group: 'org.springframework', name: 'spring-jdbc'
  testImplementation group: 'org.assertj', name: 'assertj-core'
  testRuntimeOnly group: 'org.hsqldb', name: 'hsqldb'
  testRuntimeOnly group: 'org.slf4j', name: 'slf4j-log4j12'
  testRuntimeOnly files(project(':Model').file('src/main/sql'))
}

jar {
  manifest {
    attributes 'Main-Class': 'fr.elimerl.registre.transfer.DataTransfer'
  }
}

shadowJar {
  mergeServiceFiles {
    include 'META-INF/spring.*'
  }
  dependencies {
    exclude(dependency('org.slf4j:slf4j-api'))
  }
}

assemble {
  dependsOn shadowJar
}
