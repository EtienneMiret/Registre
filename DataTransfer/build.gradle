plugins {
  id 'com.gradleup.shadow' version '8.3.11'
}

description = ''
dependencies {
  implementation project(':Model')
  implementation libs.slf4j.api
  implementation "org.springframework:spring-context"
  implementation libs.javax.transaction.api
  runtimeOnly "org.springframework:spring-orm"
  testImplementation libs.bundles.tests
  testImplementation "org.springframework:spring-jdbc"
  testRuntimeOnly libs.h2
  testRuntimeOnly libs.slf4j.log4j12
  testRuntimeOnly files(project(':Model').file('src/main/sql'))
}

jar {
  manifest {
    attributes 'Main-Class': 'fr.elimerl.registre.transfer.DataTransfer'
  }
}

shadowJar {
  mergeServiceFiles {
    include 'META-INF/spring.*'
  }
  dependencies {
    exclude(dependency('org.slf4j:slf4j-api'))
  }
}

assemble {
  dependsOn shadowJar
}
