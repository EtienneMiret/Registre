[versions]
slf4j = "1.7.36"

[libraries]

spring-framework = { module = "org.springframework:spring-framework-bom", version = "5.3.19" }
spring-security = { module = "org.springframework.security:spring-security-bom", version = "5.6.3" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-log4j12 = { module = "org.slf4j:slf4j-log4j12", version.ref = "slf4j" }
slf4j-jul = { module = "org.slf4j:jul-to-slf4j", version.ref = "slf4j" }

javax-servlet-api = { module = "javax.servlet:javax.servlet-api", version = "3.1.0" }
javax-transaction-api = { module = "javax.transaction:javax.transaction-api", version = "1.2" }
eclipse-persistence = { module = "org.eclipse.persistence:org.eclipse.persistence.jpa", version = "2.7.10" }
mitre-openid-connect = { module = "org.mitre:openid-connect-client", version = "1.3.4" }
thymeleaf-spring-framework = { module = "org.thymeleaf:thymeleaf-spring5", version = "3.0.15.RELEASE" }
thymeleaf-spring-security = { module = "org.thymeleaf.extras:thymeleaf-extras-springsecurity5", version = "3.0.4.RELEASE" }
hibernate-validator = { module = "org.hibernate.validator:hibernate-validator", version = "6.2.3.Final" }

junit = { module = "junit:junit", version = "4.13.2" }
mockito = { module = "org.mockito:mockito-core", version = "4.5.1" }
h2 = { module = "org.hsqldb:hsqldb", version = "2.4.1" }
assertj = { module = "org.assertj:assertj-core", version = "3.22.0" }
equalsverifier = { module = "nl.jqno.equalsverifier:equalsverifier", version = "2.5.2" }

[bundles]
thymeleaf = ["thymeleaf-spring-framework", "thymeleaf-spring-security"]
tests = ["junit", "mockito", "assertj"]
