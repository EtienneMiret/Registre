[versions]
slf4j = "2.0.20"

[libraries]

jackson = { module = "com.fasterxml.jackson:jackson-bom", version = "2.23.0" }
spring-framework = { module = "org.springframework:spring-framework-bom", version = "6.2.19" }
spring-security = { module = "org.springframework.security:spring-security-bom", version = "6.5.11" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-log4j12 = { module = "org.slf4j:slf4j-log4j12", version.ref = "slf4j" }
slf4j-jul = { module = "org.slf4j:jul-to-slf4j", version.ref = "slf4j" }

jakarta-servlet = { module = "jakarta.servlet:jakarta.servlet-api", version = "6.1.0" }
jakarta-transaction = { module = "jakarta.transaction:jakarta.transaction-api", version = "2.0.1" }
jakarta-annotation = { module = "jakarta.annotation:jakarta.annotation-api", version = "3.0.0" }
eclipse-persistence = { module = "org.eclipse.persistence:org.eclipse.persistence.jpa", version = "3.0.4" }
thymeleaf-spring-framework = { module = "org.thymeleaf:thymeleaf-spring6", version = "3.1.7.RELEASE" }
thymeleaf-spring-security = { module = "org.thymeleaf.extras:thymeleaf-extras-springsecurity6", version = "3.1.7.RELEASE" }
hibernate-validator = { module = "org.hibernate.validator:hibernate-validator", version = "8.0.6.Final" }

junit = { module = "junit:junit", version = "4.13.2" }
mockito = { module = "org.mockito:mockito-core", version = "5.24.0" }
h2 = { module = "org.hsqldb:hsqldb", version = "2.7.4" }
assertj = { module = "org.assertj:assertj-core", version = "3.27.7" }
equalsverifier = { module = "nl.jqno.equalsverifier:equalsverifier", version = "4.5.2" }

[bundles]
thymeleaf = ["thymeleaf-spring-framework", "thymeleaf-spring-security"]
tests = ["junit", "mockito", "assertj"]
